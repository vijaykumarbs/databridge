<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataBridge — Master Data Import Tool</title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://api.openai.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="description" content="Transform and validate master data from any source format to your required output. Browser-based master data transformation. Files stay in your browser unless you choose optional AI mapping; then sample data is sent to your selected provider.">
<script src="./vendor/xlsx.full.min.js"></script>
<script src="./vendor/papaparse.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --surface-0:#f5f4f0;--surface-1:#f0efe9;--surface-2:#ffffff;
    --text-primary:#1a1a18;--text-secondary:#5F5E5A;--text-muted:#888780;
    --text-accent:#185FA5;--text-danger:#A32D2D;--text-success:#3B6D11;--text-warning:#854F0B;
    --border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.2);
    --border-accent:#378ADD;--border-danger:#A32D2D;--border-success:#3B6D11;
    --fill-accent:#378ADD;--fill-accent-hover:#185FA5;
    --bg-accent:#E6F1FB;--bg-danger:#FCEBEB;--bg-success:#EAF3DE;--bg-warning:#FAEEDA;
    --fill-success:#639922;--fill-danger:#E24B4A;
    --radius:8px;--font-sans:system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,monospace
  }
  @media(prefers-color-scheme:dark){
    :root{
      --surface-0:#1a1a18;--surface-1:#222220;--surface-2:#2c2c2a;
      --text-primary:#f0efe9;--text-secondary:#a0a09a;--text-muted:#686860;
      --border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18)
    }
  }
  body{font-family:var(--font-sans);background:var(--surface-0);color:var(--text-primary);font-size:14px;line-height:1.5}
  .h{background:var(--surface-2);border-bottom:0.5px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .h-logo{font-size:15px;font-weight:500;letter-spacing:-.3px}
  .h-logo span{color:var(--text-accent)}
  .h-right{display:flex;align-items:center;gap:12px}
  .badge{font-size:11px;padding:2px 8px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent)}
  .h-link{font-size:12px;color:var(--text-secondary);text-decoration:none}
  .h-link:hover{color:var(--text-accent)}
  .wrap{max-width:860px;margin:0 auto;padding:20px 20px 60px}
  .step{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .step-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;user-select:none}
  .step-hd:hover{background:var(--surface-1)}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--fill-accent);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .step-num.done{background:var(--fill-success)}
  .step-num.inactive{background:var(--surface-1);color:var(--text-muted)}
  .step-title{font-size:13px;font-weight:500;flex:1}
  .step-sub{font-size:12px;color:var(--text-secondary)}
  .chevron{font-size:12px;color:var(--text-muted);transition:transform .15s}
  .chevron.open{transform:rotate(180deg)}
  .step-body{padding:0 18px 18px;border-top:0.5px solid var(--border)}
  .lbl{font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;display:block;margin-top:14px}
  textarea,input[type=text],input[type=password],select{width:100%;padding:8px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius);font-family:inherit;font-size:13px;background:var(--surface-2);color:var(--text-primary);outline:none}
  textarea:focus,input:focus,select:focus{box-shadow:0 0 0 2px var(--bg-accent);border-color:var(--border-accent)}
  textarea{resize:vertical;min-height:80px;font-family:var(--font-mono)}
  .btn{padding:7px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);transition:background .1s}
  .btn:hover{background:var(--surface-1)}
  .btn-primary{background:var(--fill-accent);color:#fff;border-color:transparent}
  .btn-primary:hover{background:var(--fill-accent-hover)}
  .btn:disabled{opacity:.4;cursor:default}
  .drop-zone{border:1.5px dashed var(--border-strong);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--surface-1)}
  .drop-zone:hover,.drop-zone.drag{border-color:var(--border-accent);background:var(--bg-accent)}
  .drop-zone p{font-size:13px;color:var(--text-secondary);margin-top:6px}
  .file-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .file-chip{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius)}
  .fn{font-size:12px;font-weight:500}
  .fs{font-size:11px;color:var(--text-muted);margin-left:6px}
  .file-rm{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;line-height:1;padding:2px 4px}
  .file-rm:hover{color:var(--text-danger)}
  .col-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-top:8px}
  .col-hd{font-size:11px;font-weight:500;color:var(--text-muted);padding:0 0 4px}
  .add-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .info-box{background:var(--bg-accent);border:0.5px solid var(--border-accent);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--text-accent);margin-top:12px}
  .warn-box{background:var(--bg-warning);border:0.5px solid rgba(133,79,11,.4);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--text-warning)}
  .err-box{background:var(--bg-danger);border:0.5px solid var(--border-danger);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--text-danger)}
  .success-box{background:var(--bg-success);border:0.5px solid var(--border-success);border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--text-success)}
  .progress-bar{height:4px;background:var(--surface-1);border-radius:2px;overflow:hidden;margin-top:10px}
  .progress-fill{height:100%;background:var(--fill-accent);border-radius:2px;transition:width .3s}
  .stat-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:80px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px}
  .stat-n{font-size:20px;font-weight:500}
  .stat-l{font-size:11px;color:var(--text-secondary);margin-top:2px}
  .stat-n.ok{color:var(--text-success)}
  .stat-n.er{color:var(--text-danger)}
  .key-input{font-family:var(--font-mono);letter-spacing:.02em}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(24,95,165,.2);border-top-color:var(--fill-accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .help{font-size:11px;color:var(--text-muted);margin-top:4px}
  .preview-table-wrap{overflow-x:auto;margin-top:10px;border:0.5px solid var(--border);border-radius:8px}
  .preview-table{border-collapse:collapse;width:100%;font-size:12px}
  .preview-table th{background:var(--surface-1);padding:6px 10px;text-align:left;font-weight:500;border-bottom:0.5px solid var(--border);white-space:nowrap}
  .preview-table td{padding:5px 10px;border-bottom:0.5px solid var(--border);white-space:nowrap;font-family:var(--font-mono);font-size:11px}
  .preview-table tr:last-child td{border-bottom:none}
  .preview-table tr.err-row td{background:var(--bg-danger)}
  .preview-table td.err-col{color:var(--text-danger);font-family:var(--font-sans);font-size:11px;font-weight:500;min-width:140px;max-width:200px;white-space:normal}
  .divider{height:0.5px;background:var(--border);margin:16px 0}
  .rule-chip{display:flex;align-items:center;gap:6px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 10px;margin-bottom:6px}
  .rule-chip .rc-label{font-size:12px;flex:1}
  .rule-chip .rc-field{font-size:11px;font-family:var(--font-mono);color:var(--text-accent);background:var(--bg-accent);padding:1px 6px;border-radius:4px}
  .rule-chip .rc-rm{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:15px;line-height:1;padding:2px}
  .rule-chip .rc-rm:hover{color:var(--text-danger)}
  .tabs{display:flex;gap:0;border-bottom:0.5px solid var(--border);margin-bottom:14px}
  .tab{padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-secondary);margin-bottom:-0.5px}
  .tab.active{color:var(--text-accent);border-bottom-color:var(--border-accent)}
  .tab:hover:not(.active){background:var(--surface-1)}
  code{font-family:var(--font-mono);background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;font-size:12px}
</style>
</head>
<body>
<div class="h">
  <div class="h-logo">Data<span>Bridge</span></div>
  <div class="h-right">
    <span class="badge">v1.0</span>
    <a class="h-link" href="https://github.com/vijaykumarbs/databridge" target="_blank">GitHub ↗</a>
  </div>
</div>
<div class="wrap">
  <div id="app"></div>
</div>
<script src="./vendor/xlsx.full.min.js"></script>
<script src="./vendor/papaparse.min.js"></script>
<script src="./src/app.js" defer></script>
</body>
</html>
